<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>Rohit Ravindra Padwal</title>
    <script>
      // spa-github-pages pattern for a root-hosted user site / custom domain.
      // Encode the complete relative URL, including query and hash, exactly once.
      var path = location.pathname + location.search + location.hash;
      location.replace('/index.html?__spa=' + encodeURIComponent(path));
    </script>
  </head>
  <body><p>Opening page… <a href="/">Return home</a></p></body>
</html>
